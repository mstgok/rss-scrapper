name: RSS Feed Güncelleyici

on:
  schedule:
    - cron: "0 */3 * * *"  # Her 3 saatte bir çalışır
  workflow_dispatch:        # Elle tetikleme butonu sağlar

permissions:
  contents: write

jobs:
  scrape-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Paketleri Yükle
        run: pip install -r requirements.txt

      - name: Betiği Çalıştır
        run: python scraper.py

      - name: feed.xml Güncelle ve Push Et
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add feed.xml
          git diff --quiet && git diff --staged --quiet || (git commit -m "RSS feed güncellendi [skip ci]" && git push)
